<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <title>To Do App</title>
</head>
<body>
    <nav class="navbar bg-light shadow-sm mb-3">
        <div class="container">
            <a class="navbar-brand m-auto" href="#">
                <img src="assets/logo.png" alt="To-Do Logo" width="40" height="40">
            </a>
        </div>
    </nav>
    <div class="container d-flex flex-wrap justify-content-between">
        <div>
            <div class="card task-list">
                <div class="card-body mb-3">
                    <h2 class="text-warning">Pending</h2>
                    <div>
                        <form class="search-form" id="pending-search">
                            <div class="border rounded-1 bg-white d-flex mb-3">
                                <input type="text" class="form-control shadow-none border-0" name="title" placeholder="Search...">
                                <button class="border-0 rounded-1 bg-white" type="submit"><i class="bi bi-search"></i></button>
                            </div>
                        </form>
                    </div>
                    <div id="pending-tasks">
        <!--                 Add pending tasks here-->
                    </div>
                </div>
            </div>
        </div>
        <div>
            <div class="card task-list">
                <div class="card-body mb-3">
                    <h2 class="text-success">Completed</h2>
                    <div>
                        <form class="search-form" id="completed-search">
                            <div class="border rounded-1 bg-white d-flex mb-3">
                                <input type="text" class="form-control shadow-none border-0" name="title" placeholder="Search...">
                                <button class="border-0 rounded-1 bg-white" type="submit"><i class="bi bi-search"></i></button>
                            </div>
                        </form>
                    </div>
                    <div id="completed-tasks">
                        <!--                 Add your pending tasks here-->
                    </div>
                </div>
            </div>
        </div>
        <div>
            <form class="card new-task" id="task-form">
                <div class="card-body mb-3">
                    <h2>New Task</h2>
                    <input type="text" class="form-control shadow-none mb-3" name="title" placeholder="Enter task title">
                    <textarea class="form-control shadow-none mb-3" name="description" placeholder="Enter task description" rows="3"></textarea>
                    <select class="form-select shadow-none" name="status" >
                        <option>Pending</option>
                        <option>Completed</option>
                    </select>
                </div>
                <button type="submit" class="w-100 btn btn-primary mb-3">Add</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
