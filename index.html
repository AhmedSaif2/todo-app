<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <title>To Do App</title>
</head>
<body>
    <nav class="navbar bg-light shadow-sm mb-3">
        <div class="container">
            <a class="navbar-brand m-auto" href="#">
                <img src="images/logo.png" alt="To-Do Logo" width="40" height="40">
            </a>
        </div>
    </nav>
    <div class="container d-flex flex-wrap justify-content-between">
        <div class="tasks-container" id="pending-container">
            <div class="card task-list">
                <div class="card-body mb-3">
                    <h2 class="text-center text-warning">Pending</h2>
                    <div class="search-form d-flex justify-content-between mb-3" id="pending-search">
                        <div class="border rounded-1 bg-white d-flex">
                            <input type="text" class="form-control shadow-none border-0" name="title" placeholder="Search...">
                            <button class="border-0 rounded-1 bg-white search" id="pending-search"><i class="bi bi-search"></i></button>
                        </div>
                        <div  class="border rounded-1 bg-white d-flex">
                            <button class="border-0 rounded-1 bg-white sort" id="pending-sort" data-bs-toggle="tooltip" title="sort by priority">
                                <i class="bi bi-sort-up"></i>
                            </button>
                        </div>
                    </div>
                    <div id="pending-tasks">
                        <!--                 Add pending tasks here-->
                    </div>
                </div>
            </div>
        </div>
        <div class="tasks-container" id="completed-container">
            <div class="card task-list">
                <div class="card-body mb-3">
                    <h2 class="text-center text-success">Completed</h2>
                    <div class="search-form d-flex justify-content-between mb-3">
                        <div class="border rounded-1 bg-white d-flex">
                            <input type="text" class="form-control shadow-none border-0" name="title" placeholder="Search...">
                            <button class="border-0 rounded-1 bg-white search" id="completed-search"><i class="bi bi-search"></i></button>
                        </div>
                        <div  class="border rounded-1 bg-white d-flex">
                            <button class="border-0 rounded-1 bg-white sort" id="completed-sort" data-bs-toggle="tooltip" title="sort by priority">
                                <i class="bi bi-sort-up"></i>
                            </button>
                        </div>
                    </div>
                    <div id="completed-tasks">
                        <!--                 Add completed tasks here-->
                    </div>
                </div>
            </div>
        </div>
        <div>
            <form method="post" class="card new-task" id="task-form">
                <div class="card-body mb-3">
                    <h2 class="text-center">New Task</h2>
                    <input type="text" class="form-control shadow-none mb-3" name="title" placeholder="Enter task title">
                    <textarea class="form-control shadow-none mb-3" name="description" placeholder="Enter task description" rows="3"></textarea>
                    <select class="form-select shadow-none mb-3" name="status" >
                        <option>Pending</option>
                        <option>Completed</option>
                    </select>
                    <label for="priority" class="form-label">Priority</label>
                    <div class="d-flex justify-content-between  mb-3">
                        <select class="form-select w-70 shadow-none" name="priority" id="priority">
                            <option>low</option>
                            <option>medium</option>
                            <option>high</option>
                        </select>
                    </div>
                    <button type="submit" class="w-100 btn btn-primary mb-3">Add</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="js/app.js" defer></script>
</body>
</html>
